name: deploy-westside
# Builds the Westside pitch (pitches/westside) and deploys it to EdgeOne Pages as the project "mask360westside".
#  - With the repository secret EDGEONE_API_TOKEN set, every push updates that project and keeps its link.
#  - Without it, each run makes an anonymous deployment, which must be claimed within an hour from the
#    link in the run summary (claim it into the same EdgeOne account as mask360os).
on:
  push:
    branches: [claude/wizardly-bardeen-2oc2qq]
    paths: ['pitches/westside/**', '.github/workflows/deploy-westside.yml']
  workflow_dispatch:
concurrency:
  group: deploy-westside
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      PROJECT: mask360westside
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          STRICT=1 python3 pitches/westside/build.py
          python3 pitches/westside/web.py "$RUNNER_TEMP/site"
      - name: Deploy
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          ok=""
          for i in 1 2 3 4; do
            if [ -n "$EDGEONE_API_TOKEN" ]; then
              npx --yes edgeone@1.6.41 makers deploy site -n "$PROJECT" -t "$EDGEONE_API_TOKEN" --json 2>&1 | tee deploy.log || true
            else
              npx --yes edgeone@1.6.41 makers deploy site -n "$PROJECT" --anonymous --site global --json 2>&1 | tee deploy.log || true
            fi
            if grep -q '"status":"success"' deploy.log; then ok=1; break; fi
            sleep 8
          done
          [ -n "$ok" ] || { echo "Deploy failed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          RESULT=$(grep '"status":"success"' deploy.log | tail -1)
          URL=$(echo "$RESULT" | grep -o '"url":"[^"]*"' | cut -d'"' -f4)
          CLAIM=$(echo "$RESULT" | grep -o '"claimUrl":"[^"]*"' | cut -d'"' -f4)
          EXPIRES=$(echo "$RESULT" | grep -o '"expiresAt":"[^"]*"' | cut -d'"' -f4)
          {
            echo "## Seen at Westside is live"
            echo ""
            echo "Open: ${URL%%\?*}"
            echo ""
            echo "Full link: $URL"
            if [ -n "$CLAIM" ]; then
              echo ""
              echo "Anonymous deployment. Claim it before $EXPIRES or EdgeOne removes it: $CLAIM"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$RESULT"
